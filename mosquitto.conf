# Broker config for the ComfortRoom ESP32 firmware.
# The sketch connects without credentials (PubSubClient::connect(clientId, ...)),
# so anonymous access stays enabled. Do not expose this port beyond the LAN.

listener 1883
allow_anonymous true

# Survive container restarts (mount a volume at /mosquitto/data).
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Log to the container's stdout so `podman logs` / `docker logs` works.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
